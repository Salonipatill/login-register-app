<!DOCTYPE html><!--this tell that browser uses HTML5--->
<!---it helps browser render the page using modern HTML standards-->
<!--it is declaration not html tag-->
<html lang="en"><!--html is the root element  of the HTML document-->
    <!---every other html elements  written inside it-->
    <!---lang="en" tells the browser that primary language of the webpage is Engilsh-->
<head><!--section contains information about the webpage-->

    <!---it generally contains:
    Page title
    Charater encoding 
    SEO meta data 
    CSS file Link
    Responsive setting
    -->
    

    <link rel="stylesheet" href="style.css">

    <!-- rel =Defines the relationship -->
     <!-- href	Specifies the file location -->
      <!-- stylesheet	Connects CSS -->

    <meta charset="UTF-8"><!--this line is important for responsive web design
    name=viewport means target the browser's visible webpage area
    width=device-width= sets th page width to the device 's screen width
    initial-scale=1.0 Sets the initial zoom level 100%'-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register|Create Account</title><!--define webpage title-->
</head>

<body><!--contains everythings that users can see and interact with it-->

<main class="container">

<section class="left-section">

    <h2>

        <span id="typing-text"></span>
        <span class="cursor">|</span>
        
       
    
    </h2>
    <p>Learn, Create and Innovate.</p>

</section>

<section class="right-section">

    <h1>Create Account</h1>
<p>Register to get started</p>

<!-- <section> is a semantic HTML element used to divide a webpage into meaningful sections. -->


<form id="registration-form">


<div>
<label for="full_name">Full Name:</label>

<input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
</div>

<div>
<label for="email">Email Address:</label>

<input
   type="email"
   id="email"
   name="email"
   placeholder="Enter your email address"
   required>
</div>




<div>
<label for="password">Password:</label>

<input 
type="password"
id="password"
name="pass_word"
placeholder="Enter your password"
minlength="8"
maxlength="128"
required
>
</div>


<div>
<label for ="confirm_password">Confirm Password:</label>

<input
type="password"
id="confirm_password"
name="confirm_password"
placeholder="Re-enter your password"
required>
</div>


<button type="submit">Create Account</button>

</form>
</section>

</main>


<script src="script.js"></script>


</body>
</html>

<!--Boilerplate = Pre-written basic code that provides the foundation for a project or feature-->
